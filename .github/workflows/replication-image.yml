name: replication-image

# Build the pinned runner image (docker/replication.Dockerfile) and publish it
# to GHCR. Only runs when the image definition changes, so the `0.25.0` tag
# keeps pointing at the same toolchain; pin a digest for a reported re-run.
#
# Setup on a fork: enable Actions, run this workflow once, then make the
# package public (Package settings -> Change visibility -> Public) so reviewers
# can pull without a token. See docs/mechanism-study/CONTAINER.md.

on:
  workflow_dispatch:
  push:
    branches: [mechanism-study, main]
    paths:
      - "docker/**"
      - ".github/workflows/replication-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and publish runner image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/replication
          tags: |
            type=raw,value=0.25.0
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/replication.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
