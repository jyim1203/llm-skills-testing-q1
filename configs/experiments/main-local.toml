# Main experiment: local Qwen 3.5 9B, 6 tasks x 3 conditions x 10 repeats.
#
# The DeepSeek pilot-01 run remains the setup proof (pipeline, fairness,
# grading). This config is the reported local-model comparison.
#
# 180 attempts. At the observed local pace (~3-4 min/attempt for hard tasks)
# expect roughly 10-12 hours plus grading. Stage it: validate with
# main-local-pilot first, then run this config overnight.
#
# Before the first run:
#   python -m skills_experiment select-tasks --local
#   python -m skills_experiment preflight --experiment main-local --write-lock
#   python -m skills_experiment run --experiment main-local --grade

[experiment]
id = "main-local-01"
model = "local-qwen-sampling"
conditions = ["A_baseline", "B_prompt_instructions", "C_skill"]
repeats = 10
seed = 20261015
interleave = true
fresh = true

[budgets]
# Local adaptation: the 9B is verbose and loop-prone. 80 steps / 1.5M tokens
# with a 64k context lets it finish; A/C can still hit the token budget on
# harder tasks, so those stop reasons are recorded as data rather than hidden.
max_steps = 80
max_tokens = 1500000
elapsed_seconds = 1800
tool_timeout_seconds = 120

[dataset]
name = "SWE-bench/SWE-bench_Lite"
revision = "b0dde1093fe417d83b7184254edf8199c1f0dff5"
split = "test"
selection_file = "data/task_selection_local.json"
offline = false

[sandbox]
kind = "docker"
docker_image_template = "swebench/sweb.eval.x86_64.{repo_slug}:latest"

[agent]
base_system_prompt = "base_system_prompt_minimal.md"

# Bare-bones base prompt + stronger v2 workflow, shared by B and C. C must
# load the skill body before editing. These overrides leave pilot-01 untouched.
[condition_options.B_prompt_instructions]
instructions_file = "workflow_instructions_v2.md"

[condition_options.C_skill]
instructions_file = "workflow_instructions_v2.md"
require_load = true

[harness]
python = ""
max_workers = 4
timeout_seconds = 1800
