# Main experiment: local Qwen 3.5 9B, 6 tasks x 3 conditions x 5 repeats.
#
# The DeepSeek pilot-01 run remains the setup proof (pipeline, fairness,
# grading). This config is the reported local-model comparison.
#
# 90 attempts. At the observed local pace (~4-5 min/attempt at the calibrated
# 2.5M/16k budgets) expect roughly 6-9 hours plus grading. Run it overnight.
# The 18-attempt main-local-pilot-01 calibration is complete; see
# results/main-local-pilot-01/RESULTS.md.
#
# The selection and image lock are already committed. To launch:
#   python -m skills_experiment run --experiment main-local --resume --grade

[experiment]
id = "main-local-01"
model = "local-qwen-sampling"
conditions = ["A_baseline", "B_prompt_instructions", "C_skill"]
repeats = 5
seed = 20261015
interleave = true
fresh = true

[budgets]
# Calibrated from the 1.5M/8192 pilot: 10/18 attempts stopped on the cumulative
# token budget and 3/18 on the per-response length cap. 2.5M cumulative lets the
# 80-step cap bind for most attempts while still capping runaway loops; the
# per-response cap is 16384 in local-qwen-sampling.toml.
max_steps = 80
max_tokens = 2500000
elapsed_seconds = 1800
tool_timeout_seconds = 120

[dataset]
name = "SWE-bench/SWE-bench_Lite"
revision = "b0dde1093fe417d83b7184254edf8199c1f0dff5"
split = "test"
selection_file = "data/task_selection_local.json"
offline = false

[sandbox]
kind = "docker"
docker_image_template = "swebench/sweb.eval.x86_64.{repo_slug}:latest"

[agent]
base_system_prompt = "base_system_prompt_minimal.md"

# Bare-bones base prompt + stronger v2 workflow, shared by B and C. C must
# load the skill body before editing. These overrides leave pilot-01 untouched.
[condition_options.B_prompt_instructions]
instructions_file = "workflow_instructions_v2.md"

[condition_options.C_skill]
instructions_file = "workflow_instructions_v2.md"
require_load = true

[harness]
python = ""
max_workers = 4
timeout_seconds = 1800
