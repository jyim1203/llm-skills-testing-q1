# Local-model run: the same frozen tasks and dataset as pilot-01, with the
# generator swapped to a self-hosted model. Budgets are raised (see below) and
# Condition C requires an explicit `load_skill` call (see condition_options);
# both are documented local-run adaptations, not changes to pilot-01.
#
# This is a *different model* run, not a repeat of pilot-01, so it gets its own
# id: runs/ and analysis stay separate.
#
#   python -m skills_experiment run --experiment pilot-local
#
# Before the first run, write the image lock (same five images as pilot-01):
#   python -m skills_experiment preflight --experiment pilot-local --write-lock

[experiment]
id = "pilot-local-01"
model = "local-qwen"
conditions = ["A_baseline", "B_prompt_instructions", "C_skill"]
# Same protocol as pilot-01. Lower this only for a shakedown (never per condition).
repeats = 3
seed = 20261015
interleave = true
fresh = true

[budgets]
# Local-model adaptation (not identical to pilot-01). The 9B is far more
# verbose and loop-prone: at 40 steps it hit the step cap with ~540k cumulative
# tokens and a ~27k-token final prompt. Raised to 80 steps / 1.5M tokens with a
# 64k context so the model has room to finish rather than being censored.
max_steps = 80
max_tokens = 1500000
elapsed_seconds = 1800
tool_timeout_seconds = 120

[dataset]
name = "SWE-bench/SWE-bench_Lite"
revision = "b0dde1093fe417d83b7184254edf8199c1f0dff5"
split = "test"
selection_file = "data/task_selection.json"
offline = false

[sandbox]
kind = "docker"
docker_image_template = "swebench/sweb.eval.x86_64.{repo_slug}:latest"

[agent]
base_system_prompt = "base_system_prompt.md"

# Local-model adaptation. The 9B ignored the original "call load_skill when the
# skill covers the task" wording: across 6 smoke attempts it made 0 load_skill
# calls, so Condition C never received the skill body. Requiring the call before
# editing makes C an actual skill-delivery condition. pilot-01 did not set this,
# so its frozen metadata-only C prompt is unchanged.
[condition_options.C_skill]
require_load = true

[harness]
python = ""
max_workers = 4
timeout_seconds = 1800
