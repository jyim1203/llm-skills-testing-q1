# SWE-bench Verified main run: 10 tasks x 3 conditions x 8 repeats = 240 attempts.
#
# Do not launch until verified-pilot-01 has passed calibration (image lock,
# two-worker concurrency, DeepSeek tool/thinking round-trip, stop reasons, and
# memory/wall-time measurements).
#
#   python -m skills_experiment plan --experiment verified-main
#   python -m skills_experiment preflight --experiment verified-main --write-lock
#   python -m skills_experiment run --experiment verified-main --resume --grade

[experiment]
id = "verified-main-01"
model = "deepseek-flash-1017"
conditions = ["A_baseline", "B_prompt_instructions", "C_skill"]
repeats = 8
seed = 20261015
interleave = true
fresh = true
workers = 2

[budgets]
max_steps = 80
max_tokens = 1000000
elapsed_seconds = 1800
tool_timeout_seconds = 120

[dataset]
name = "SWE-bench/SWE-bench_Verified"
revision = "78f471bf655a3137b2e8a75af1501690ec009ec3"
split = "test"
selection_file = "data/task_selection_verified.json"
offline = true

[sandbox]
kind = "docker"
docker_image_template = "swebench/sweb.eval.x86_64.{repo_slug}:latest"

[agent]
base_system_prompt = "base_system_prompt_minimal.md"

[condition_options.B_prompt_instructions]
instructions_file = "workflow_instructions_v2.md"

[condition_options.C_skill]
instructions_file = "workflow_instructions_v2.md"
require_load = true

[harness]
python = ""
max_workers = 2
timeout_seconds = 1800
